name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build distributions
        run: |
          python -m pip install build setuptools wheel pytest
          python -m build --no-isolation --sdist --wheel
      - name: Check source distribution contains the native extractor
        run: |
          python - <<'PY_SOURCE'
          from pathlib import Path
          import tarfile
          archive, = Path('dist').glob('*.tar.gz')
          with tarfile.open(archive) as source:
              member, = [m for m in source.getmembers() if m.name.endswith('/reproduce/drivers/gbml/extract_sra.cpp')]
              assert source.extractfile(member).read() == Path('reproduce/drivers/gbml/extract_sra.cpp').read_bytes()
          print('PASS: source archive includes the exact GBML181 C++ extractor')
          PY_SOURCE
      - name: Install built wheel and test
        run: |
          for package in dist/*.whl; do
            python -m pip install "${package}[reproduce]"
          done
          python -m pytest -q tests
      - name: Check analysis drivers and redraw all figures
        run: python reproduce/verify.py --output "$RUNNER_TEMP/merci-reproduce-check"
      - name: Check P2 preprocessing and recovery fixtures
        run: |
          python -m pip install 'anndata==0.13.4' 'pysam==0.24.1'
          python reproduce/fixtures/p2/check_gexscope.py
          python reproduce/fixtures/p2/check_half_counts.py
          python reproduce/fixtures/p2/check_joint_concat.py
          python reproduce/fixtures/p2/check_preflight.py --output "$RUNNER_TEMP/p2-preflight"
          python reproduce/fixtures/p2/check_incomplete_extraction.py --output "$RUNNER_TEMP/p2-incomplete"
          python reproduce/fixtures/p2/check_alignment_resume.py --output "$RUNNER_TEMP/p2-resume"
          python reproduce/fixtures/p2/check_alignment_consensus.py --output "$RUNNER_TEMP/p2-alignment-consensus"
          python reproduce/fixtures/p2/check_nuclear.py --output "$RUNNER_TEMP/p2-nuclear"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      - name: Check synthetic coverage axes and observation denominators
        run: |
          Rscript -e 'install.packages("data.table", repos = "https://cloud.r-project.org")'
          Rscript reproduce/fixtures/b1/check_coverage.R reproduce/drivers/b1/read_coverage.R reproduce/fixtures/b1/coverage.tsv
