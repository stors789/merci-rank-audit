name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build distributions
        run: |
          python -m pip install build setuptools wheel pytest
          python -m build --no-isolation --sdist --wheel
      - name: Install built wheel and test
        run: |
          python -m pip install dist/*.whl
          python -m pytest -q tests
